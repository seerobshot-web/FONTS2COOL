<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fontpair Web App</title>
    <!--
      GitHub Pages serves this file for any unknown path (client-side routes
      like /playground). It re-encodes the path into a query string and
      redirects to the SPA's index.html, which decodes it back on load.
      Adapted from https://github.com/rafgraph/spa-github-pages (MIT).
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1 // keep "/FONTS2COOL" (the GitHub Pages project path)

      var l = window.location
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
